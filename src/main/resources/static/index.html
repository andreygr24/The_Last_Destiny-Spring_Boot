<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Last Destiny - Backend Demo</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 20px; }
        h1 { color: #a855f7; }
        button { background: #a855f7; color: #fff; border: none; padding: 10px 18px; margin: 5px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #7c3aed; }
        pre { background: #111; border: 1px solid #c0c0c0; padding: 15px; border-radius: 8px; overflow: auto; }
        p { color: #c0c0c0; }
    </style>
</head>
<body>
<h1>The Last Destiny</h1>
<p>Backend Demo - Java + Spring Boot</p>

<button onclick="load('/members')">Ver Miembros</button>
<button onclick="load('/bank')">Ver Banco</button>
<button onclick="load('/apply')">Ver Applies</button>

<pre id="out">Click on the boton for check my code...</pre>

<script>
    async function load(url) {
        const r = await fetch(url);
        const data = await r.json();
        document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }
</script>
</body>
</html>
