<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Last Destiny Guild</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; text-align: center; padding-top: 70px; }
        h1 { color: #a855f7; font-size: 46px; margin: 0; }
        p { color: #c0c0c0; }
        button { background: #a855f7; color: #fff; border: none; padding: 15px 24px; margin: 8px; border-radius: 12px; cursor: pointer; font-size: 15px; }
        pre { background: #111; border: 1px solid #c0c0c0; padding: 16px; border-radius: 12px; text-align: left; max-width: 650px; margin: 28px auto; }
    </style>
</head>
<body>
<h1>The Last Destiny Guild</h1>
<p>Backend Demo - Java + Spring Boot + MySQL</p>

<button onclick="load('/members')">View Members</button>
<button onclick="load('/bank')">View Bank</button>
<button onclick="load('/apply')">View Applies</button>

<pre id="out">Click a button to see the data...</pre>

<script>
    async function load(url) {
        const r = await fetch(url);
        document.getElementById('out').textContent = JSON.stringify(await r.json(), null, 2);
    }
</script>
</body>
</html>
